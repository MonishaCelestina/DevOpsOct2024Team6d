name: CI Pipeline

on:
  push:
    branches:
      - main
      - dev  # Run CI on main and dev branches
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20  

      - name: Install dependencies
        run: npm install

      - name: Run Tests
        run: npm test
