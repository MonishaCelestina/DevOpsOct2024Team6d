<!DOCTYPE html>
<html>
<head>
    <title>The Library Board - Admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>The Library Board - Admin</h1>

        <h2>Student Management</h2>
        <button id="createStudentBtn">Create Student</button>
        <button id="modifyStudentBtn">Modify Student</button>
        <button id="deleteStudentBtn">Delete Student</button>
        <button id="listStudentsBtn">List Students</button>
        <button id="searchStudentBtn">Search Student</button>

        <div id="createStudentForm" style="display: none;">
            <h3>Create Student</h3>
            <label for="studentID">Student ID:</label>
            <input type="text" id="studentID" required><br><br>
            <label for="studentName">Student Name:</label>
            <input type="text" id="studentName" required><br><br>
            <label for="diploma">Diploma:</label>
            <input type="text" id="diploma" required><br><br>
            <label for="yearOfEntry">Year of Entry:</label>
            <input type="number" id="yearOfEntry" required><br><br>
            <label for="email">Email:</label>
            <input type="email" id="email" required><br><br>
            <label for="initialPoints">Initial Points:</label>
            <input type="number" id="initialPoints" required><br><br>
            <button id="createStudentSubmitBtn">Create</button>
        </div>

        <div id="modifyStudentForm" style="display: none;">
            <h3>Modify Student</h3>
            <label for="modifyStudentID">Student ID:</label>
            <input type="text" id="modifyStudentID" required><br><br>
            <button id="loadStudentBtn">Load Student</button>
            <div id="modifyStudentData"></div> 
        </div>

        <div id="studentListContainer"></div>
        <div id="searchStudentResults"></div>

        <h2>Item Management</h2> 
        <button id="createItemBtn">Create Item</button>
        <button id="modifyItemBtn">Modify Item</button>
        <button id="deleteItemBtn">Delete Item</button> 

        <div id="itemManagementContainer"></div>

    </div>

    <script src="script.js"></script>
</body>
</html>
